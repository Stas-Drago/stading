services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-club-postgres
    environment:
      POSTGRES_DB: practice
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    ports:
      - "5433:5432"
    volumes:
      - practice3_postgres_data:/var/lib/postgresql/data
      - ./create_tables.sql:/docker-entrypoint-initdb.d/01-create_tables.sql:ro
      - ./insert_data.sql:/docker-entrypoint-initdb.d/02-insert_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d practice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  practice3_postgres_data:
